name: VIP shows then disappears
description: Member shows briefly, then Sign In / free again
title: "[Bug] VIP drops "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        VIP flashes then falls back. Fill this out so I can reproduce.
  - type: input
    id: reqable-version
    attributes:
      label: Reqable version
      placeholder: "3.2.16 · Play"
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: Module version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone / Android
      placeholder: "Xiaomi 15 · HyperOS / Android 16"
    validations:
      required: true
  - type: input
    id: root-lsposed
    attributes:
      label: Root / LSPosed
      placeholder: "Magisk · Zygisk LSPosed"
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where did VIP show first?
      options:
        - Drawer / side menu
        - Account Center
        - Both
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: how-long
    attributes:
      label: About how long until it drops?
      options:
        - Under 2 seconds (flash)
        - A few seconds
        - After opening Account Center
        - After a while / random
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: every-time
    attributes:
      label: Does it happen every launch?
      options:
        - Yes, every time
        - Most times
        - Sometimes
        - Only once so far
    validations:
      required: true
  - type: checkboxes
    id: basics
    attributes:
      label: You already…
      options:
        - label: Enabled module + scoped Reqable in LSPosed
          required: true
        - label: Rebooted after changing scope
          required: true
        - label: Opened Reqable once with internet after reboot
          required: true
  - type: textarea
    id: extra
    attributes:
      label: Extra (optional)
      description: Short screen recording, other modules list, or LSPosed lines mentioning ReqableFaker
      placeholder: "GIF / module list / a few log lines…"
