name: Doesn't work (general)
description: VIP missing, wrong UI, or anything not covered by the other bug forms
title: "[Bug] "
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Prefer **VIP shows then disappears** or **Crash** if that matches — those forms ask better questions.
  - type: input
    id: reqable-version
    attributes:
      label: Reqable version
      description: App info → version, and where you installed it (Play / official / GitHub)
      placeholder: "3.2.16 · Play"
    validations:
      required: true
  - type: input
    id: module-version
    attributes:
      label: Module version
      description: Unlocker APK version from the release page
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Phone / Android
      placeholder: "Xiaomi 15 · HyperOS / Android 16"
    validations:
      required: true
  - type: input
    id: root-lsposed
    attributes:
      label: Root / LSPosed
      description: Magisk, KernelSU, or APatch + version; Zygisk LSPosed if known
      placeholder: "Magisk · Zygisk LSPosed"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see vs what you expected
      placeholder: "No crown / still Sign In / Account looks wrong / …"
    validations:
      required: true
  - type: checkboxes
    id: basics
    attributes:
      label: You already…
      options:
        - label: Enabled module + scoped Reqable in LSPosed
          required: true
        - label: Rebooted after changing scope
          required: true
        - label: Opened Reqable once with internet after reboot
          required: true
        - label: Installed from my GitHub release (not re-signed)
          required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots (required)
      description: Drag/paste images here — drawer (or Sign In), Account Center if you can open it, and LSPosed module + scope for Reqable.
      placeholder: "Paste or drop screenshots…"
    validations:
      required: true
  - type: textarea
    id: lsposed-logs
    attributes:
      label: LSPosed logs (optional)
      description: Open Reqable once, then in LSPosed logs search for ReqableFaker and paste matching lines (or write “none”).
      placeholder: "ReqableFaker: 1.0.1 loading in com.reqable.android …"
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Extra (optional)
      description: Other Magisk/LSPosed modules, short recording, anything else
      placeholder: "Module list / notes…"
